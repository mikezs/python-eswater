name: Release

# Bump and commit the version locally, then push a vX.Y.Z tag. Publishing uses
# GitHub's built-in token and PyPI trusted publishing; no personal token needed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}"
          assert f'__version__ = "{version}"' in Path("src/eswater/__init__.py").read_text()
          PY
      - name: Validate and build
        run: |
          python -m pip install -e '.[dev]' build twine
          ruff check .
          mypy src
          pytest -v --cov --cov-report=term-missing --cov-fail-under=90
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes dist/*
