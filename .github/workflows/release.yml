name: Release

# Publishes to PyPI via trusted publishing (OIDC) and cuts a GitHub release
# when a v* tag is pushed. No API token is stored: configure a PyPI trusted
# publisher for this repo/workflow first (see one-time setup below).
#
# One-time PyPI setup (project already exists as `eswater`):
#   PyPI → your project → Manage → Publishing → Add a trusted publisher:
#     Owner:            mikezs
#     Repository:       python-eswater
#     Workflow name:    release.yml
#     Environment:      (leave blank)
# After that, pushing a tag like `v0.1.1` builds and publishes automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "${GITHUB_REF_NAME#v}"
          --generate-notes
          dist/*
